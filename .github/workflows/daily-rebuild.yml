# Rebuild the site every morning so past events drop off "upcoming" automatically.
# Setup: Netlify → Site configuration → Build hooks → add hook, then save its URL
# as the GitHub repo secret NETLIFY_BUILD_HOOK.
name: Daily rebuild
on:
  schedule:
    - cron: '0 9 * * *' # 5 a.m. Eastern (EDT)
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST -d '{}' "${{ secrets.NETLIFY_BUILD_HOOK }}"
