# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main (including CMS edits), every morning (so past events
# drop off "upcoming" automatically), and on demand from the Actions tab.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * *' # 5 a.m. Eastern (EDT)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
